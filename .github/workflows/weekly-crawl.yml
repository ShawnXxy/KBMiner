name: Weekly Knowledge Base Crawl

on:
  schedule:
    # Run every Monday at 2:00 AM UTC (cron format: minute hour day-of-month month day-of-week)
    - cron: '0 2 * * 1'
  
  # Allow manual triggering of the workflow
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run in test mode (limited content)'
        required: false
        default: false
        type: boolean

jobs:
  crawl-knowledge-base:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Required to commit and push changes
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # Use a token to ensure the action can push back to the repo
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # The project appears to use only standard library modules
        # If additional dependencies are needed, add them here
        echo "No additional dependencies required"
    
    - name: Configure git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
    
    - name: Run ActionTech crawler (incremental)
      run: |
        if [ "${{ github.event.inputs.test_mode }}" = "true" ]; then
          echo "Running ActionTech crawler in test mode..."
          python miner.py --source mysql --sources actiontech --incremental --test --verbose
        else
          echo "Running ActionTech crawler in production mode..."
          python miner.py --source mysql --sources actiontech --incremental --verbose
        fi
      continue-on-error: true
    
    - name: Run Alibaba crawler (incremental)
      run: |
        if [ "${{ github.event.inputs.test_mode }}" = "true" ]; then
          echo "Running Alibaba crawler in test mode..."
          python miner.py --source mysql --sources alibaba --incremental --test --verbose
        else
          echo "Running Alibaba crawler in production mode..."
          python miner.py --source mysql --sources alibaba --incremental --verbose
        fi
      continue-on-error: true
    
    - name: Check for changes
      id: changes
      run: |
        if git diff --quiet; then
          echo "changed=false" >> $GITHUB_OUTPUT
          echo "No changes detected"
        else
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "Changes detected"
          git status
        fi
    
    - name: Commit and push changes
      if: steps.changes.outputs.changed == 'true'
      run: |
        # Add all changes in the kb directory
        git add kb/
        
        # Create commit message with timestamp
        commit_msg="chore: weekly knowledge base update - $(date '+%Y-%m-%d %H:%M UTC')"
        
        # Show what will be committed
        echo "Changes to be committed:"
        git diff --cached --stat
        
        # Commit changes
        git commit -m "$commit_msg"
        
        # Push changes
        git push origin main
    
    - name: Create workflow summary
      run: |
        echo "## Weekly Crawl Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Date:** $(date '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
        echo "**Test Mode:** ${{ github.event.inputs.test_mode || 'false' }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ steps.changes.outputs.changed }}" = "true" ]; then
          echo "✅ **Status:** Changes detected and committed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Files changed:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          git diff HEAD~1 --name-only >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        else
          echo "ℹ️ **Status:** No new content found" >> $GITHUB_STEP_SUMMARY
        fi
